name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "GCC 13 / Debug"
            cc:   gcc-13
            cxx:  g++-13
            type: Debug

          - name: "GCC 13 / Release"
            cc:   gcc-13
            cxx:  g++-13
            type: Release

          - name: "Clang 18 / Debug"
            cc:   clang-18
            cxx:  clang++-18
            type: Debug

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang 18
        if: startsWith(matrix.cxx, 'clang')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18

      - name: Configure
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.type }} \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel $(nproc)
